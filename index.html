<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Bitody</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <nav class="navbar">
            <div class="logo">Bitody</div>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/about">About</a></li>
                <li><a href="/projects">Projects</a></li>
                <li><a href="/contact">Contact</a></li>
            </ul>
        </nav>
        <div class="home-hero">
            <img src="assets/fulllogonoglow.png" class="hero-logo">
            <p class="hero-sublogo">Chill Developer, Minecraft Player, KasaiSora Studio Member :D</p>
            <div class="hero-buttons"><a class="button" href="/projects">View Projects</a><a class="button" href="/contact">Contact Me</a></div>
        </div>

        <script>
            const hamburger = document.querySelector('.hamburger');
            const navLinks = document.querySelector('.nav-links');

            hamburger.addEventListener('click', () => {
                hamburger.classList.toggle('active');
                navLinks.classList.toggle('active');
            });
            document.querySelectorAll('.nav-links li a').forEach(link => {
                link.addEventListener('click', () => {
                    hamburger.classList.remove('active');
                    navLinks.classList.remove('active');
                });
            });
        </script>
        <footer>
            <p>&copy; 2025 Bitody. All rights reserved.</p>
        </footer>
    </body>
</html>
